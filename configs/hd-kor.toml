mask_dilation_offset = 30

[render]
# renderer = "default"
renderer = "manga2eng"
alignment = "auto"
disable_font_border = true
# 가로쓰기 강제: 세로 풍선 넘침/어긋남 방지, offset 3: 읽기 편한 폰트 크기 (2026-10-03 비교 테스트로 확정)
font_size_offset = 3
font_size_minimum = 10
direction = "horizontal"
uppercase = false
lowercase = false
gimp_font = "BMKIRANGHAERANG-TTF"
no_hyphenation = true

[upscale]
upscaler = "esrgan"
revert_upscaling = false

[translator]
# hdTrans — 룰 기반 오프라인 일한 번역기 (GLM 대체, 비용·거부·429 없음)
# 사전: configs/hdtrans-userdict.txt (프로덕션 GLM 코푸스 정렬, 1,440엔트리)
# 품질: 고빈도 세그먼트 GLM 다수결 일치율 67.7% (GLM 자기 일관성 57.3% 초과)
# 요구: vendor/hdtrans/hdTrans-0.7.4/ (compose·FINISH_MOUNTS로 컨테이너 마운트)
translator = "hdtrans"
target_lang = "KOR"
no_text_lang_skip = false

[detector]
detector = "default"
detection_size = 2048
text_threshold = 0.5
det_rotate = false
det_auto_rotate = true
det_invert = false
det_gamma_correct = false
box_threshold = 0.7
unclip_ratio = 2.3

[colorizer]
colorization_size = 576
denoise_sigma = 30
colorizer = "none"

[inpainter]
inpainter = "lama_large"
inpainting_size = 2048
inpainting_precision = "bf16"

[ocr]
use_mocr_merge = false
ocr = "48px"
min_text_length = 0
ignore_bubble = 0
