services:
  manga_image_translator1:
    image: zyddnys/manga-image-translator:main
    user: "1000:1000"
    container_name: manga_image_translator_gpu1
    entrypoint: python
    command: server/main.py --verbose --start-instance --host=0.0.0.0 --port=5003 --use-gpu
    volumes:
      - ./../../result:/app/result
      - ./../../data:/app/data
      - ./../../translated:/app/translated
      # - ./../../server/main.py:/app/server/main.py
      - ./../../server:/app/server
      - ./../../configs:/app/configs
      - ./../../fonts:/app/fonts
      - ./../../manga_translator/translators/custom_openai.py:/app/manga_translator/translators/custom_openai.py
      - ./../../manga_translator/translators/config_gpt.py:/app/manga_translator/translators/config_gpt.py
      - ./../../manga_translator/translators/keys.py:/app/manga_translator/translators/keys.py
      - ./../../manga_translator/args.py:/app/manga_translator/args.py
      - ./../../tmp:/app/tmp
      - ./../../vendor/hdtrans:/app/vendor/hdtrans
      - ./../../manga_translator/manga_translator.py:/app/manga_translator/manga_translator.py
      - ./../../manga_translator/mode/local.py:/app/manga_translator/mode/local.py
      - ./../../manga_translator/mode/finish.py:/app/manga_translator/mode/finish.py
      # - ./../../server/instance.py:/app/server/instance.py      
    ports:
      - 5003:5003
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu] 
    environment:  

      # custom OpenAI-compatible API
      CUSTOM_OPENAI_API_KEY: ${OPENAI_COMPATIBLE_API_KEY_1}
      CUSTOM_OPENAI_API_BASE: ${OPENAI_COMPATIBLE_BASE_URL}
      CUSTOM_OPENAI_MODEL: ${OPENAI_COMPATIBLE_MODEL}
      CUSTOM_OPENAI_REASONING_EFFORT: ${OPENAI_COMPATIBLE_REASONING_EFFORT:-}
      CUSTOM_OPENAI_THINKING: ${OPENAI_COMPATIBLE_THINKING:-}
      CUSTOM_OPENAI_MAX_TOKENS: ${OPENAI_COMPATIBLE_MAX_TOKENS:-}
      CUSTOM_OPENAI_TEMPERATURE: ${OPENAI_COMPATIBLE_TEMPERATURE:-}
      CUSTOM_OPENAI_MAX_CONCURRENCY: '2'
      CUSTOM_OPENAI_TIMEOUT: ${OPENAI_COMPATIBLE_TIMEOUT:-}

  manga_image_translator2:
