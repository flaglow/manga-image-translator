# Hy-MT2 로컬 LLM 번역 서버 (vLLM) — manga-image-translator 라이브 라인과 별도 기동.
#
#   소형(상시):   docker compose -f demo/doc/docker-compose-hymt2.yml up -d hymt2-small
#   대형(에스컬):  docker compose -f demo/doc/docker-compose-hymt2.yml --profile escalation up -d
#   종료:         docker compose -f demo/doc/docker-compose-hymt2.yml down
#
# 리소스 예산 (RTX 4090 24GB 기준, 설계문서 docs/로컬 LLM 번역 파이프라인 설계__hymt2.md):
#   small — VRAM ~3GB (가중치 1.9GB + KV). GPU 파이프라인과 항상 병렬 가능.
#   big   — 가중치 ~30GB > VRAM → --cpu-offload-gb 18 로 MoE 전문가 일부 CPU 이관.
#           VRAM ~12GB + RAM ~20GB. GPU 컨테이너 3~5개 풀가동 시 VRAM 부족할 수 있어
#           대기열이 얕을 때/컨테이너 수를 줄인 뒤 profile escalation 으로 기동할 것.
#
# 번역기 접속: translators/hymt2.py (HYMT2_SMALL_BASE/HYMT2_BIG_BASE 기본값이 아래 포트).
# 모델이 게이트드(gated)면 주석 해제해 HF_TOKEN 설정. 아키텍처(hunyuan_v1_dense/moe)가
# 이미지에 없다는 오류 시 vllm/vllm-openai 태그를 최신으로 올릴 것.
services:
  hymt2-small:
    image: vllm/vllm-openai:latest
    container_name: mit_hymt2_small
    networks: [hymt2]
    command: >
      --model tencent/Hy-MT2-1.8B-FP8
      --served-model-name hymt2-1.8b
      --max-model-len 4096
      --gpu-memory-utilization 0.2
      --enforce-eager
      --port 8011
    # environment:
    #   - HF_TOKEN=
    ports:
      - "8011:8011"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: 2g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8011/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  hymt2-big:
    image: vllm/vllm-openai:latest
    container_name: mit_hymt2_big
    profiles: ["escalation"]
    networks: [hymt2]
    command: >
      --model tencent/Hy-MT2-30B-A3B-FP8
      --served-model-name hymt2-30b
      --cpu-offload-gb 18
      --max-model-len 4096
      --gpu-memory-utilization 0.55
      --enforce-eager
      --port 8012
    # environment:
    #   - HF_TOKEN=
    ports:
      - "8012:8012"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: 2g
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8012/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

# finish/평가 컨테이너가 vLLM에 붙는 명명 네트워크 (방화벽 무관 컨테이너 DNS 통신)
networks:
  hymt2:
    name: hymt2
